<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P05 · Hierarchical Layers Portrait — AI Agent Capability Stack 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e8e4df;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{
  /* 9:16 letterbox — slide stays 9:16 even if window is landscape */
  width:min(100vw, calc(100vh * 9 / 16));
  height:min(100vh, calc(100vw * 16 / 9));
  aspect-ratio:9/16;
  background:#0a0a0b;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.wrap svg{width:100%;height:100%;object-fit:contain;display:block}
</style></head><body><div class="wrap"><svg id="svg" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="gridSmall" width="20" height="20" patternUnits="userSpaceOnUse">

  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c4a35a" stop-opacity="0"/>
    <stop offset="50%" stop-color="#c4a35a" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#c4a35a" stop-opacity="0"/>

  <clipPath id="mainClip"><rect x="8" y="8" width="704" height="1264"/></clipPath>
</defs>

<rect width="720" height="1280" fill="#0a0a0b"/>
<rect width="720" height="1280" fill="url(#gridLarge)"/>

<!-- Vertical scan line (top to bottom sweep) -->
<rect id="scanLine" x="8" y="-200" width="704" height="200" fill="url(#scanGrad)" clip-path="url(#mainClip)" opacity="0.8"/>

<!-- Top-left version label -->

  <text y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#c4a35a" opacity="0.6">P05</text>

<!-- ============ HEADER (y: 80-160) ============ -->

<text x="360" y="124" text-anchor="middle" font-family="Noto Serif SC" font-size="20" font-weight="400" fill="#e8e4df" opacity="0" class="title2">5 层自下而上 · 越往上越自主</text>
<text x="360" y="156" text-anchor="middle" font-family="Space Grotesk" font-size="13" fill="#c4a35a" letter-spacing="4" opacity="0" class="subtitle">HIERARCHICAL CAPABILITY STACK</text>

<!-- ============ SPINE REMOVED — was cutting through layer captions at x=360 ============ -->

<!-- ============ 5 STACKED LAYERS (DOM order: L5 top → L1 bottom)

  <circle cx="130" cy="655" r="22" fill="#c4a35a" opacity="0.95" class="badge"/>
  <text x="130" y="661" text-anchor="middle" font-family="Space Grotesk" font-size="15" font-weight="700" fill="#0a0a0b">L3</text>
  <text x="170" y="620" font-family="Space Grotesk" font-size="14" font-weight="500" fill="#c4a35a" letter-spacing="2">MEMORY &amp; RAG</text>
  <text x="170" y="655" font-family="Noto Serif SC" font-size="24" font-weight="700" fill="#e8e4df">记忆系统</text>

  <text x="170" y="718" font-family="JetBrains Mono" font-size="11" fill="#c4a35a" opacity="0.5" letter-spacing="2">PRODUCTION · STANDARD</text>
  <g class="maturity" opacity="0">
    <circle cx="585" cy="612" r="5" fill="#c4a35a" opacity="0.95"/>
    <circle cx="585" cy="634" r="5" fill="#c4a35a" opacity="0.95"/>
    <circle cx="585" cy="656" r="5" fill="#c4a35a" opacity="0.95"/>

  <circle cx="125" cy="830" r="22" fill="#c4a35a" opacity="0.95" class="badge"/>

  <g class="maturity" opacity="0">

</g>

  <circle cx="120" cy="1005" r="22" fill="#c4a35a" opacity="0.95" class="badge"/>
  <text x="120" y="1011" text-anchor="middle" font-family="Space Grotesk" font-size="15" font-weight="700" fill="#0a0a0b">L1</text>

<!-- ============ Side label rail REMOVED — was visually crowding L1/L5 layer edges.
     The maturity dots inside each layer carry the same info more cleanly. ============ -->

<!-- ============ FOOTER (y: 1230-1280) ============ -->
<text x="30" y="1255" font-family="JetBrains Mono" font-size="11" fill="#c4a35a" opacity="0.35" letter-spacing="1">STR-PORTRAIT-05 / REV.A</text>
<text x="690" y="1255" text-anchor="end" font-family="JetBrains Mono" font-size="11" fill="#c4a35a" opacity="0.35" letter-spacing="1">9:16 · HIERARCHICAL LAYERS</text>

</svg></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  // ===== Header reveal =====
  gsap.to('.title', { opacity: 1, duration: 0.8, delay: 0.2, ease: 'power2.out' });
  gsap.to('.title2', { opacity: 1, duration: 0.8, delay: 0.45, ease: 'power2.out' });
  gsap.to('.subtitle', { opacity: 1, duration: 0.8, delay: 0.7, ease: 'power2.out' });

  // ===== Layers stagger BOTTOM-to-TOP =====
  // DOM order is L5→L1 (top to bottom in source). `from: 'end'` reverses
  // the stagger so L1 (last in DOM) reveals FIRST, then L2, L3, L4, L5 —
  // foundation-first, capability-builds-upward.
  gsap.to('.layer', {
    opacity: 1,
    duration: 0.55,
    delay: 1.1,
    ease: 'power2.out',
    stagger: { each: 0.22, from: 'end' }
  });

  // ===== Maturity dots fade in WITH their layer (same bottom-up cadence) =====
  gsap.to('.maturity', {
    opacity: 1,
    duration: 0.5,
    delay: 1.35,
    ease: 'power2.out',
    stagger: { each: 0.22, from: 'end' }
  });

  // ===== Spine + emergenceAxis tweens removed (elements deleted from SVG) =====

  // ===== PERPETUAL: layer stroke breathing (very subtle, sine.inOut yoyo) =====
  gsap.to('.layerBox', {
    strokeOpacity: 0.85,
    duration: 2.6,
    repeat: -1,
    yoyo: true,
    ease: 'sine.inOut',
    stagger: 0.15,
    delay: 3.4
  });

  // ===== PERPETUAL: L5 (apex) extra glow pulse — slower, more pronounced =====
  gsap.to('.layerApex', {
    strokeOpacity: 1,
    strokeWidth: 1.4,
    duration: 3.2,
    repeat: -1,
    yoyo: true,
    ease: 'sine.inOut',
    delay: 3.6
  });

  // ===== PERPETUAL: corner ring rotation =====
  gsap.to('#ringInner', {
    rotation: 360,
    transformOrigin: 'center',
    duration: 16,
    repeat: -1,
    ease: 'none'
  });

  // ===== PERPETUAL: vertical scan line (top to bottom sweep) =====
  gsap.to('#scanLine', {
    attr: { y: 1280 },
    duration: 7,
    repeat: -1,
    ease: 'none',
    delay: 1.4
  });
})();
</script></body></html>
