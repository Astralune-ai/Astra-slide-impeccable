  <!-- L2 → S2: cos=0 sin=1  start(360,490) end(360,656) len=166 -->

<text x="690" y="1255" text-anchor="end" font-family="JetBrains Mono" font-size="11" fill="#c4a35a" opacity="0.35" letter-spacing="1">9:16 · HUB SPOKE</text>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const ns = 'http://www.w3.org/2000/svg';

  // ============ HEADER REVEAL (stagger) ============
  gsap.to('.title',    { opacity: 1, duration: 0.8, delay: 0.2,  ease: 'power2.out' });
  gsap.to('.title2',   { opacity: 1, duration: 0.8, delay: 0.45, ease: 'power2.out' });
  gsap.to('.subtitle', { opacity: 1, duration: 0.8, delay: 0.7,  ease: 'power2.out' });

  // ============ ENTRANCE TIMELINE ============
  const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

  // Hub scale-in (0.6 → 1.0) with back.out
  tl.fromTo('#hub',
    { opacity: 0, scale: 0.6, transformOrigin: '360px 380px' },
    { opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.7)' },
    1.0
  );
  // Hub glow appears with hub
  tl.to('#hubGlow', { opacity: 0.45, duration: 0.6 }, 1.2);

  // === ORDER: spokes pop FIRST (so user sees endpoints), then connectors draw OUT to them ===
  // Spokes pop in (back.out) — endpoints established before any line is drawn
  const spokeCenters = [[180,720],[360,720],[540,720],[180,970],[360,970],[540,970]];
  gsap.utils.toArray('.spokeNode').forEach((node, i) => {
    const [cx, cy] = spokeCenters[i];
    tl.fromTo(node,
      { opacity: 0, scale: 0.5, transformOrigin: `${cx}px ${cy}px` },
      { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(1.7)' },
      1.6 + i * 0.08
    );
  });

  // Connectors draw-on AFTER all spokes are visible (stroke-dashoffset → 0)
  tl.to('.connLine', {
    strokeDashoffset: 0, duration: 0.7, stagger: 0.08, ease: 'power2.out'
  }, 2.3);

  // Junction dots pop in last, after connectors have reached their endpoints
  tl.to('.jDot', { opacity: 0.9, duration: 0.3, stagger: 0.05 }, 3.0);

  // ============ COUNTER for "6 / SPOKES" ============
  const hubCnt = document.getElementById('hubCnt');
  gsap.to({ v: 0 }, {
    v: 6, duration: 1.2, delay: 2.4, ease: 'power2.out',
    onUpdate: function () {
      hubCnt.textContent = Math.round(this.targets()[0].v);
    }
  });

  // ============ PERPETUAL: Hub pulse glow (softGlow + opacity yoyo) ============
  gsap.to('#hubGlow', {
    opacity: 0.7, duration: 2.4, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 3.2
  });

  // ============ PERPETUAL: Hub outer dashed ring rotation ============
  gsap.to('#hubRingOuter', {
    rotation: 360, duration: 36, repeat: -1, ease: 'none', svgOrigin: '360 380'
  });

  // ============ PERPETUAL: Ripples emanating from hub (r: 110 → 320) ============
  gsap.utils.toArray('.ripple').forEach((r, i) => {
    gsap.fromTo(r,
      { attr: { r: 110 }, opacity: 0 },
      {
        attr: { r: 320 }, opacity: 0,
        keyframes: { opacity: [0, 0.4, 0] },
        duration: 4.0, repeat: -1, ease: 'power1.out',
        delay: 3.0 + i * 1.3
      });
  });

  // ============ PERPETUAL: Spoke circle border breathing ============
  gsap.to('.spokeBg', {
    strokeOpacity: 0.6, strokeWidth: 2, duration: 2.4, repeat: -1, yoyo: true,
    ease: 'sine.inOut', stagger: 0.15, delay: 3.4
  });

  // ============ PERPETUAL: Connector subtle opacity pulse ============
  gsap.to('.connLine', {
    opacity: 0.4, duration: 2.6, repeat: -1, yoyo: true, ease: 'sine.inOut',
    stagger: 0.1, delay: 3.8
  });

  // ============ PERPETUAL: Junction dot blink ============
  gsap.to('.jDot', {
    opacity: 0.4, duration: 1.4, repeat: -1, yoyo: true, ease: 'sine.inOut',
    stagger: 0.07, delay: 3.6
  });

  // ============ PERPETUAL: Corner ring rotation ============
  gsap.to('#ringInner', { rotation: 360, transformOrigin: 'center', duration: 16, repeat: -1, ease: 'none' });

  // ============ PERPETUAL: Vertical scan line sweep (top to bottom) ============
  gsap.to('#scanLine', { attr: { y: 1280 }, duration: 7, repeat: -1, ease: 'none', delay: 1.2 });

  // ============ PERPETUAL: Data particles flowing hub → spoke → loop (rAF) ============
  // 6 lines as [startX, startY, endX, endY] — exact same coords as <line> elements
  const lines = [
    [308.5, 477.2, 209.9, 663.4],
    [360,   490,   360,   656  ],
    [411.5, 477.2, 510.1, 663.4],
    [327.9, 485.2, 198.7, 908.8],
    [360,   490,   360,   906  ],
    [392.1, 485.2, 521.3, 908.8]
  ];
  const pg = document.getElementById('packets');
  const packets = [];
  // 2 packets per line, offset in phase. All travel hub→spoke (one-directional flow outward).
  lines.forEach((ln, idx) => {
    for (let j = 0; j < 2; j++) {
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('r', 2.4);
      c.setAttribute('fill', '#c4a35a');
      c.setAttribute('opacity', 0);
      c.setAttribute('filter', 'url(#glow)');
      pg.appendChild(c);
      packets.push({
        el: c, line: ln,
        phase: (idx * 0.16 + j * 0.5) % 1,
        speed: 0.0032 + Math.random() * 0.0015
      });
    }
  });
  function packetTick() {
    packets.forEach(p => {
      p.phase = (p.phase + p.speed) % 1;
      const t = p.phase;
      const x = p.line[0] + (p.line[2] - p.line[0]) * t;
      const y = p.line[1] + (p.line[3] - p.line[1]) * t;
      p.el.setAttribute('cx', x);
      p.el.setAttribute('cy', y);
      // Fade in/out near ends
      const d = Math.min(p.phase, 1 - p.phase) * 2;
      p.el.setAttribute('opacity', Math.min(d * 1.5, 0.9));
    });
    requestAnimationFrame(packetTick);
  }
  setTimeout(packetTick, 2800);
})();
</script></body></html>
