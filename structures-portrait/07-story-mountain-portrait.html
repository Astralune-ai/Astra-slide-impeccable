<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  // ============ HEADER REVEAL ============
  gsap.to('.title',    { opacity: 1, duration: 0.7, delay: 0.2, ease: 'power2.out' });
  gsap.to('.title2',   { opacity: 1, duration: 0.7, delay: 0.45, ease: 'power2.out' });
  gsap.to('.subtitle', { opacity: 1, duration: 0.7, delay: 0.7, ease: 'power2.out' });

  // ============ SPINE DRAW-ON (top → bottom via stroke-dashoffset) ============
  // Compute spine length once and run dashoffset tween
  const spine = document.getElementById('spine');
  const spineLen = spine.getTotalLength();
  spine.setAttribute('stroke-dasharray', spineLen);
  spine.setAttribute('stroke-dashoffset', spineLen);
  gsap.to('#spine', { opacity: 1, duration: 0.3, delay: 1.0 });
  gsap.to('#spine', { strokeDashoffset: 0, duration: 1.6, delay: 1.0, ease: 'power2.inOut' });
  // After draw, restore the dashed look (4,4 pattern) for subtle texture
  gsap.set('#spine', { delay: 2.65, attr: { 'stroke-dasharray': '4,4' }, strokeDashoffset: 0 });

  // ============ STORY ARC OVERLAY DRAW (slower, more subtle) ============
  const arc = document.getElementById('arcOverlay');
  const arcLen = arc.getTotalLength();
  arc.setAttribute('stroke-dasharray', arcLen);
  arc.setAttribute('stroke-dashoffset', arcLen);
  gsap.to('#arcOverlay', { strokeDashoffset: 0, duration: 2.4, delay: 1.0, ease: 'power1.inOut' });
  // Restore dashed pattern after arc finishes drawing
  gsap.set('#arcOverlay', { delay: 3.45, attr: { 'stroke-dasharray': '2,3' }, strokeDashoffset: 0 });

  // ============ ACT NODES POP IN (timed to spine progress) ============
  // Spine reaches each y at: y200 → 1.0s, y240 → ~1.07s, y440 → ~1.42s, y640 → ~1.78s,
  // y860 → ~2.17s, y1060 → ~2.53s. Stagger 0.22s per node, base delay 1.15s.
  gsap.fromTo('.actNode:not(.actClimax)',
    { opacity: 0, scale: 0, transformOrigin: '360px 640px' },
    { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(1.5)',
      stagger: { each: 0.22, from: 0 }, delay: 1.15 }
  );

  // ============ ACT 3 CLIMAX — DRAMATIC ENTRANCE ============
  // The climax node lands when spine reaches y=640 (~1.78s after spine start).
  // 0 → 1.2 → 1.0 with bounce, plus glow burst halo.
  const climaxDelay = 1.15 + 0.22 * 2; // ~1.59s — slot in node stagger
  gsap.set('.actClimax', { transformOrigin: '360px 640px' });
  gsap.fromTo('.actClimax',
    { opacity: 0, scale: 0 },
    { opacity: 1, scale: 1.2, duration: 0.55, ease: 'back.out(2.2)', delay: climaxDelay }
  );
  gsap.to('.actClimax', { scale: 1.0, duration: 0.4, ease: 'power2.inOut', delay: climaxDelay + 0.55 });
  // Glow burst halo: ring expands from 0 → 130 with opacity 0 → 1 → 0.7
  gsap.fromTo('#climaxHalo',
    { attr: { r: 0 }, opacity: 0 },
    { attr: { r: 130 }, opacity: 1, duration: 0.6, ease: 'power2.out', delay: climaxDelay }
  );
  gsap.to('#climaxHalo', { opacity: 0, attr: { r: 160 }, duration: 0.5, ease: 'power1.out', delay: climaxDelay + 0.6 });

  // ============ CONNECTORS (after each card's node lands) ============
  gsap.to('.conn', {
    opacity: 0.55, duration: 0.4,
    stagger: { each: 0.22, from: 0 },
    delay: 1.15 + 0.6
  });

  // ============ CARDS — slide in from spine outward ============
  // Odd acts (i=0,2,4) → from RIGHT spine edge (x=360) outward → final x. Translate x from -60 to 0.
  // Even acts (i=1,3) → from LEFT spine edge → translate x from +60 to 0.
  // Easier: animate each card's transform translateX based on data-i parity.
  document.querySelectorAll('.actCard').forEach((card) => {
    const i = parseInt(card.dataset.i);
    const fromRight = (i % 2 === 0); // 0,2,4 are right side cards → start from -60 (toward spine)
    const fromX = fromRight ? -60 : 60;
    const cardDelay = 1.15 + 0.22 * i + 0.45;
    gsap.fromTo(card,
      { opacity: 0, x: fromX },
      { opacity: 1, x: 0, duration: 0.55, ease: 'power2.out', delay: cardDelay }
    );
  });

  // ============ COUNTER tween (Act 4 · 300+ 单) ============
  document.querySelectorAll('.counter').forEach((el) => {
    const target = parseFloat(el.dataset.target);
    gsap.to({ v: 0 }, {
      v: target, duration: 1.2, delay: 1.15 + 0.22 * 3 + 0.6, ease: 'power2.out',
      onUpdate: function () { el.textContent = Math.round(this.targets()[0].v); }
    });
  });

  // ============ PERPETUAL: Act 3 climax pulse ring ============
  // CRITICAL: filter region MUST be -75%/250% on softGlow (硬规则 9 — see <defs>).
  // Use strokeOpacity + r tween, NOT brightness filter (Chrome bug per debug history).
  gsap.to('#climaxPulse', {
    attr: { r: 130 }, opacity: 0, duration: 2.4, repeat: -1, ease: 'power1.out',
    delay: 3.5,
    onRepeat: function () { gsap.set('#climaxPulse', { attr: { r: 80 }, opacity: 0.6 }); }
  });
  gsap.set('#climaxPulse', { opacity: 0.6, delay: 3.5 });

  // PERPETUAL: climax card stroke breath (strokeOpacity, not brightness)
  gsap.to('.actCardClimax rect:first-child', {
    strokeOpacity: 0.5, strokeWidth: 2.2,
    duration: 2.6, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 4
  });

  // PERPETUAL: spine subtle gradient flow (top→bottom). Animate gradient via CSS rotation
  // is unreliable — instead pulse the spine opacity to imply flow.
  gsap.to('#spine', {
    opacity: 0.7, duration: 3.2, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 4
  });

  // PERPETUAL: corner ring rotation
  gsap.to('#ringInner', { rotation: 360, transformOrigin: 'center', duration: 16, repeat: -1, ease: 'none' });

  // PERPETUAL: vertical scan line top→bottom (slower 9s — story pacing)
  gsap.to('#scanLine', { attr: { y: 1280 }, duration: 9, repeat: -1, ease: 'none', delay: 1.5 });

  // PERPETUAL: non-climax card subtle stroke breathing
  gsap.to('.actCard:not(.actCardClimax) rect:first-child', {
    strokeOpacity: 0.85, duration: 3.4, repeat: -1, yoyo: true, ease: 'sine.inOut',
    stagger: 0.18, delay: 4.5
  });
})();
</script></body></html>
