<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  const ns = 'http://www.w3.org/2000/svg';

  // ============ ENTRANCE TIMELINE ============
  const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

  // Header reveal stagger
  tl.to('.title', { opacity: 1, duration: 0.7 }, 0.2)
    .to('.title2', { opacity: 1, duration: 0.7 }, 0.45)
    .to('.subtitle', { opacity: 1, duration: 0.7 }, 0.7);

  // Water surface line draws left → right
  tl.to('#waterLineBase', { attr: { x2: 680 }, duration: 1.1, ease: 'power2.inOut' }, 1.0);
  tl.to('.wl-above', { opacity: 0.6, duration: 0.5 }, 1.6);
  tl.to('.wl-mid', { opacity: 0.7, duration: 0.5 }, 1.7);
  tl.to('.wl-below', { opacity: 0.6, duration: 0.5 }, 1.8);

  // Iceberg above water — fade + scale from y=440 anchor
  tl.fromTo('#icebergAbove',
    { opacity: 0, scaleY: 0, transformOrigin: '360px 440px' },
    { opacity: 1, scaleY: 1, duration: 0.9, ease: 'power2.out' }, 1.4);

  // Water overlay fades in (covers grid below water)
  tl.to('#waterOverlay', { opacity: 1, duration: 0.7 }, 1.8);

  // Iceberg below water grows down
  tl.fromTo('#icebergBelow',
    { opacity: 0, scaleY: 0, transformOrigin: '360px 440px' },
    { opacity: 1, scaleY: 1, duration: 1.4, ease: 'power2.out' }, 2.0);

  // Above items pop in (back.out)
  tl.to('.above-item', { opacity: 1, duration: 0.5, stagger: 0.15, ease: 'back.out(1.6)' }, 2.1);
  tl.to('.above-conn', { opacity: 0.7, duration: 0.4, stagger: 0.15 }, 2.6);

  // Below items reveal slowly (suggesting depth)
  tl.to('.below-item', { opacity: 1, duration: 0.7, stagger: 0.18, ease: 'power2.out' }, 2.9);
  tl.to('.below-conn', { opacity: 0.6, duration: 0.5, stagger: 0.15 }, 3.6);

  // Stats hint
  tl.to('#stats', { opacity: 1, duration: 0.6 }, 4.4);

  // Stats counter
  const visEl = document.getElementById('visPct');
  const hidEl = document.getElementById('hidPct');
  gsap.to({ v: 0 }, {
    v: 30, duration: 1.2, delay: 4.6, ease: 'power2.out',
    onUpdate: function () { visEl.textContent = Math.round(this.targets()[0].v); }
  });
  gsap.to({ v: 0 }, {
    v: 70, duration: 1.4, delay: 4.6, ease: 'power2.out',
    onUpdate: function () { hidEl.textContent = Math.round(this.targets()[0].v); }
  });

  // ============ PERPETUAL: Bubbles rising from underwater ============
  const bg = document.getElementById('bubbles');
  const POOL = 14;
  const bubbles = [];
  for (let i = 0; i < POOL; i++) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('fill', '#c4d8ea');
    c.setAttribute('opacity', 0);
    bg.appendChild(c);
    bubbles.push({ el: c, busy: false, x: 0, y: 0, vy: 0, r: 1, drift: 0, life: 0, maxLife: 0 });
  }
  // Spawn near underwater item positions for thematic effect
  const spawnZones = [
    { x: 170, y: 1100 }, { x: 360, y: 1110 }, { x: 550, y: 1100 },
    { x: 220, y: 950 }, { x: 500, y: 950 }, { x: 360, y: 1020 }
  ];
  function spawnBubble(b) {
    b.busy = true;
    const z = spawnZones[Math.floor(Math.random() * spawnZones.length)];
    b.x = z.x + (Math.random() - 0.5) * 80;
    b.y = z.y + Math.random() * 30;
    b.vy = 0.5 + Math.random() * 1.0;
    b.r = 3 + Math.random() * 5;     // r=3-8 per spec
    b.drift = (Math.random() - 0.5) * 0.5;
    b.life = 0;
    b.maxLife = 380 + Math.random() * 280;
    b.el.setAttribute('r', b.r);
    b.el.setAttribute('opacity', 0);
  }
  let bSpawn = 0;
  function bubbleTick() {
    bSpawn++;
    if (bSpawn > 18) {
      bSpawn = 0;
      const free = bubbles.find(b => !b.busy);
      if (free) spawnBubble(free);
    }
    bubbles.forEach(b => {
      if (!b.busy) return;
      b.y -= b.vy;
      b.x += b.drift;
      b.life++;
      b.el.setAttribute('cx', b.x);
      b.el.setAttribute('cy', b.y);
      // fade in over first 40 frames, fade out near top
      const fadeIn = Math.min(b.life / 40, 1);
      const distToSurface = b.y - 440;
      const fadeOut = Math.max(Math.min(distToSurface / 60, 1), 0);
      const opacity = fadeIn * fadeOut * (0.3 + Math.random() * 0.001 + 0.3);
      b.el.setAttribute('opacity', Math.min(opacity, 0.6));
      // Disappear at water line (clip-path also enforces)
      if (b.y < 440 || b.life > b.maxLife) {
        b.busy = false;
        b.el.setAttribute('opacity', 0);
      }
    });
    requestAnimationFrame(bubbleTick);
  }
  bubbleTick();

  // ============ PERPETUAL: Water surface subtle wave (dashed line shifts) ============
  gsap.to('#waterLineBase', {
    attr: { 'stroke-dashoffset': -20 }, duration: 3.2, repeat: -1, ease: 'none', delay: 2.5
  });

  // ============ PERPETUAL: Underwater iceberg subtle stroke breathing ============
  gsap.to('#icebergBelowPath', {
    strokeOpacity: 0.85, duration: 2.6, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 4.0
  });
  gsap.to('#icebergAbovePath', {
    strokeOpacity: 0.85, duration: 3.0, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 4.2
  });

  // ============ PERPETUAL: Card border breathing (below items) ============
  gsap.to('.below-item rect:nth-child(2)', {
    strokeOpacity: 0.95, duration: 2.4, repeat: -1, yoyo: true, ease: 'sine.inOut',
    stagger: 0.1, delay: 4.5
  });

  // ============ PERPETUAL: Corner ring rotation ============
  gsap.to('#ringInner', { rotation: 360, duration: 18, repeat: -1, ease: 'none', transformOrigin: '50% 50%' });

  // ============ PERPETUAL: Vertical scan line top → bottom ============
  gsap.to('#scanLine', { attr: { y: 1280 }, duration: 7, repeat: -1, ease: 'none', delay: 1.2 });
})();
</script></body></html>
