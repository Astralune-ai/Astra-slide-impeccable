<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P03 · Funnel Portrait — SaaS Marketing Conversion 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e8e4df;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{
  /* 9:16 letterbox — slide stays 9:16 even if window is landscape */
  width:min(100vw, calc(100vh * 9 / 16));
  height:min(100vh, calc(100vw * 16 / 9));
  aspect-ratio:9/16;
  background:#0a0a0b;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.wrap svg{width:100%;height:100%;object-fit:contain;display:block}
.tnum{font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap"><svg id="svg" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="gridSmall" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#c4a35a" stroke-width="0.15" opacity="0.2"/>
  </pattern>
  <pattern id="gridLarge" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#gridSmall)"/>
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#c4a35a" stroke-width="0.4" opacity="0.25"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="layerGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c4a35a" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#c4a35a" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c4a35a" stop-opacity="0"/>
    <stop offset="50%" stop-color="#c4a35a" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#c4a35a" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="mainClip"><rect x="8" y="8" width="704" height="1264"/></clipPath>
</defs>

<rect width="720" height="1280" fill="#0a0a0b"/>
<rect width="720" height="1280" fill="url(#gridLarge)"/>

<!-- Vertical scan line (top to bottom sweep) -->
<rect id="scanLine" x="8" y="-200" width="704" height="200" fill="url(#scanGrad)" clip-path="url(#mainClip)" opacity="0.8"/>

<!-- Top-left version label -->
<text x="30" y="34" font-family="JetBrains Mono,monospace" font-size="12" fill="#c4a35a" opacity="0.35" letter-spacing="2">IMPECCABLE · v2</text>

<!-- Top-right corner ring -->
<g id="cornerRing" transform="translate(660, 50)">
  <circle r="26" fill="none" stroke="#c4a35a" stroke-width="0.6" opacity="0.3"/>
  <circle id="ringInner" r="18" fill="none" stroke="#c4a35a" stroke-width="0.4" opacity="0.35" stroke-dasharray="3,4"/>
  <circle r="10" fill="#c4a35a" opacity="0.08"/>
  <text y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#c4a35a" opacity="0.6">P03</text>
</g>

<!-- ============ HEADER (y: 0-180) ============ -->
<text x="360" y="92" text-anchor="middle" font-family="Noto Serif SC" font-size="36" font-weight="700" fill="#c4a35a" opacity="0" class="title">营销转化漏斗</text>
<text x="360" y="124" text-anchor="middle" font-family="Noto Serif SC" font-size="20" font-weight="400" fill="#e8e4df" opacity="0" class="title2">5 层 · 5 阶段衰减</text>
<text x="360" y="156" text-anchor="middle" font-family="Space Grotesk" font-size="13" fill="#c4a35a" letter-spacing="4" opacity="0" class="subtitle">SAAS MARKETING FUNNEL</text>

<!-- ============ FUNNEL BODY (y: 200-1080) ============
  5 layers, height 168 each, gap 10. 5*168 + 4*10 = 880
  Width interpolation: top 560 → bottom 140, 6 width points step 84
  widths = [560, 476, 392, 308, 224, 140]
  Each layer is a TRAPEZOID: top width = widths[N], bottom width = widths[N+1]
  x-centered around 360
  Layer y-ranges:
    L0: 200 → 368
    L1: 378 → 546
    L2: 556 → 724
    L3: 734 → 902
    L4: 912 → 1080
============ -->

<!-- Layer 0 · Awareness · 100% · 10,000 -->
<g class="flayer" data-i="0" opacity="0">
  <polygon class="fpoly" points="80,200 640,200 598,368 122,368" fill="#0a0a0b" stroke="#c4a35a" stroke-width="1.2" stroke-opacity="0.5"/>
  <polygon class="fglass" points="80,200 640,200 598,368 122,368" fill="url(#layerGrad)" opacity="0.6"/>
  <text x="360" y="244" text-anchor="middle" font-family="Noto Serif SC" font-size="22" font-weight="700" fill="#e8e4df">Awareness · 品牌曝光</text>
  <text x="360" y="296" text-anchor="middle" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#c4a35a"><tspan class="tnum" data-target="100" data-decimals="0">0</tspan>%</text>
  <text x="360" y="338" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="#8a8578" letter-spacing="2">10,000 IMPRESSIONS</text>
  <!-- Right-side flow arrow (drop to next layer: 100→25 = 75% loss) -->
  <g class="floss" data-i="0">
    <line x1="675" y1="368" x2="675" y2="378" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
    <polygon points="670,376 675,384 680,376" fill="#c4a35a" opacity="0.7"/>
    <text x="690" y="376" font-family="JetBrains Mono" font-size="13" fill="#b33a3a" font-weight="600" text-anchor="end">↓75%</text>
  </g>
</g>

<!-- Layer 1 · Interest · 25% · 2,500 -->
<g class="flayer" data-i="1" opacity="0">
  <polygon class="fpoly" points="122,378 598,378 556,546 164,546" fill="#0a0a0b" stroke="#c4a35a" stroke-width="1.2" stroke-opacity="0.5"/>
  <polygon class="fglass" points="122,378 598,378 556,546 164,546" fill="url(#layerGrad)" opacity="0.6"/>
  <text x="360" y="422" text-anchor="middle" font-family="Noto Serif SC" font-size="22" font-weight="700" fill="#e8e4df">Interest · 兴趣激发</text>
  <text x="360" y="474" text-anchor="middle" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#c4a35a"><tspan class="tnum" data-target="25" data-decimals="0">0</tspan>%</text>
  <text x="360" y="516" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="#8a8578" letter-spacing="2">2,500 VISITORS</text>
  <g class="floss" data-i="1">
    <line x1="675" y1="546" x2="675" y2="556" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
    <polygon points="670,554 675,562 680,554" fill="#c4a35a" opacity="0.7"/>
    <text x="690" y="554" font-family="JetBrains Mono" font-size="13" fill="#b33a3a" font-weight="600" text-anchor="end">↓68%</text>
  </g>
</g>

<!-- Layer 2 · Consideration · 8% · 800 -->
<g class="flayer" data-i="2" opacity="0">
  <polygon class="fpoly" points="164,556 556,556 514,724 206,724" fill="#0a0a0b" stroke="#c4a35a" stroke-width="1.2" stroke-opacity="0.5"/>
  <polygon class="fglass" points="164,556 556,556 514,724 206,724" fill="url(#layerGrad)" opacity="0.6"/>
  <text x="360" y="600" text-anchor="middle" font-family="Noto Serif SC" font-size="22" font-weight="700" fill="#e8e4df">Consideration · 评估比对</text>
  <text x="360" y="652" text-anchor="middle" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#c4a35a"><tspan class="tnum" data-target="8" data-decimals="0">0</tspan>%</text>
  <text x="360" y="694" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="#8a8578" letter-spacing="2">800 LEADS</text>
  <g class="floss" data-i="2">
    <line x1="675" y1="724" x2="675" y2="734" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
    <polygon points="670,732 675,740 680,732" fill="#c4a35a" opacity="0.7"/>
    <text x="690" y="732" font-family="JetBrains Mono" font-size="13" fill="#b33a3a" font-weight="600" text-anchor="end">↓62.5%</text>
  </g>
</g>

<!-- Layer 3 · Intent · 3% · 300 -->
<g class="flayer" data-i="3" opacity="0">
  <polygon class="fpoly" points="206,734 514,734 472,902 248,902" fill="#0a0a0b" stroke="#c4a35a" stroke-width="1.2" stroke-opacity="0.5"/>
  <polygon class="fglass" points="206,734 514,734 472,902 248,902" fill="url(#layerGrad)" opacity="0.6"/>
  <text x="360" y="778" text-anchor="middle" font-family="Noto Serif SC" font-size="22" font-weight="700" fill="#e8e4df">Intent · 意向决策</text>
  <text x="360" y="830" text-anchor="middle" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#c4a35a"><tspan class="tnum" data-target="3" data-decimals="0">0</tspan>%</text>
  <text x="360" y="872" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="#8a8578" letter-spacing="2">300 TRIAL SIGNUPS</text>
  <g class="floss" data-i="3">
    <line x1="675" y1="902" x2="675" y2="912" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
    <polygon points="670,910 675,918 680,910" fill="#c4a35a" opacity="0.7"/>
    <text x="690" y="910" font-family="JetBrains Mono" font-size="13" fill="#b33a3a" font-weight="600" text-anchor="end">↓60%</text>
  </g>
</g>

<!-- Layer 4 · Purchase · 1.2% · 120 -->
<g class="flayer" data-i="4" opacity="0">
  <polygon class="fpoly" points="248,912 472,912 430,1080 290,1080" fill="#0a0a0b" stroke="#c4a35a" stroke-width="1.4" stroke-opacity="0.85" filter="url(#glow)"/>
  <polygon class="fglass" points="248,912 472,912 430,1080 290,1080" fill="url(#layerGrad)" opacity="0.85"/>
  <text x="360" y="956" text-anchor="middle" font-family="Noto Serif SC" font-size="22" font-weight="900" fill="#c4a35a">Purchase · 成交转化</text>
  <text x="360" y="1008" text-anchor="middle" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#c4a35a"><tspan class="tnum" data-target="1.2" data-decimals="1">0</tspan>%</text>
  <text x="360" y="1050" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="#e8e4df" letter-spacing="2">120 PAID CUSTOMERS</text>
</g>

<!-- ============ STATS BAR (y: 1100-1180) ============ -->
<g id="statsBar" opacity="0">
  <line x1="40" y1="1100" x2="680" y2="1100" stroke="#c4a35a" stroke-width="0.4" opacity="0.3"/>
  <!-- Stat 1: Total conversion -->
  <g transform="translate(120, 1140)">
    <text text-anchor="middle" font-family="Space Grotesk" font-size="32" font-weight="700" fill="#c4a35a" y="0"><tspan class="tnum" data-target="1.2" data-decimals="1">0</tspan>%</text>
    <text text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#8a8578" letter-spacing="2" y="22">END-TO-END</text>
  </g>
  <!-- Stat 2: Total leak -->
  <g transform="translate(280, 1140)">
    <text text-anchor="middle" font-family="Space Grotesk" font-size="32" font-weight="700" fill="#b33a3a" y="0"><tspan class="tnum" data-target="98.8" data-decimals="1">0</tspan>%</text>
    <text text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#8a8578" letter-spacing="2" y="22">TOTAL LEAK</text>
  </g>
  <!-- Stat 3: Stages -->
  <g transform="translate(440, 1140)">
    <text text-anchor="middle" font-family="Space Grotesk" font-size="32" font-weight="700" fill="#e8e4df" y="0"><tspan class="tnum" data-target="5" data-decimals="0">0</tspan></text>
    <text text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#8a8578" letter-spacing="2" y="22">STAGES</text>
  </g>
  <!-- Stat 4: Retry -->
  <g transform="translate(600, 1140)">
    <text text-anchor="middle" font-family="Space Grotesk" font-size="32" font-weight="700" fill="#c4a35a" y="0">∞</text>
    <text text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#8a8578" letter-spacing="2" y="22">RETRY</text>
  </g>
  <line x1="40" y1="1180" x2="680" y2="1180" stroke="#c4a35a" stroke-width="0.4" opacity="0.3"/>
</g>

<!-- ============ FOOTER (y: 1230-1280) ============ -->
<text x="30" y="1255" font-family="JetBrains Mono" font-size="11" fill="#c4a35a" opacity="0.35" letter-spacing="1">STR-PORTRAIT-03 / REV.A</text>
<text x="690" y="1255" text-anchor="end" font-family="JetBrains Mono" font-size="11" fill="#c4a35a" opacity="0.35" letter-spacing="1">9:16 · FUNNEL</text>

</svg></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  // Header reveal
  gsap.to('.title', { opacity: 1, duration: 0.8, delay: 0.2, ease: 'power2.out' });
  gsap.to('.title2', { opacity: 1, duration: 0.8, delay: 0.45, ease: 'power2.out' });
  gsap.to('.subtitle', { opacity: 1, duration: 0.8, delay: 0.7, ease: 'power2.out' });

  // Funnel layers stagger top → bottom
  gsap.to('.flayer', { opacity: 1, duration: 0.55, stagger: 0.18, delay: 1.0, ease: 'power2.out' });

  // Counter tweens — one per .tnum (each layer + stats bar)
  document.querySelectorAll('.tnum').forEach((el, i) => {
    const target = parseFloat(el.dataset.target);
    const decimals = parseInt(el.dataset.decimals || '0', 10);
    gsap.to({ v: 0 }, {
      v: target, duration: 1.1, delay: 1.4 + i * 0.15, ease: 'power2.out',
      onUpdate: function () {
        const v = this.targets()[0].v;
        el.textContent = decimals ? v.toFixed(decimals) : Math.round(v);
      }
    });
  });

  // Stats bar reveal
  gsap.to('#statsBar', { opacity: 1, duration: 0.7, delay: 2.4, ease: 'power2.out' });

  // PERPETUAL: layer stroke breathing (sine.inOut yoyo)
  gsap.to('.fpoly', {
    strokeOpacity: 0.85, duration: 2.4, repeat: -1, yoyo: true, ease: 'sine.inOut', stagger: 0.12, delay: 3.0
  });

  // PERPETUAL: glass fill subtle breathing
  gsap.to('.fglass', {
    opacity: 0.35, duration: 3.2, repeat: -1, yoyo: true, ease: 'sine.inOut', stagger: 0.15, delay: 3.4
  });

  // PERPETUAL: corner ring rotation
  gsap.to('#ringInner', { rotation: 360, transformOrigin: 'center', duration: 16, repeat: -1, ease: 'none' });

  // PERPETUAL: vertical scan line sweep (top to bottom)
  gsap.to('#scanLine', { attr: { y: 1280 }, duration: 7, repeat: -1, ease: 'none', delay: 1.2 });
})();
</script></body></html>
