        gsap.fromTo('#vsBadge',
          { x: 0 },

  gsap.to('#vsCapTop', { opacity: 0.5, duration: 0.6, delay: 3.0, ease: 'power2.out' });

  gsap.to('.rowB', { opacity: 1, duration: 0.4, stagger: 0.08, delay: 1.7, ease: 'power2.out' });

    scale: 1.05, transformOrigin: '360px 660px', duration: 1.6, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 3.4
  });

  // PERPETUAL: VS outer ring pulse (expand + fade)
  gsap.to('#vsRingOuter', {
    attr: { opacity: 0.05 }, duration: 2.4, repeat: -1, ease: 'power1.out',
    transformOrigin: '360px 660px', delay: 3.6,
    scale: 1.25, yoyo: true
  });

  // PERPETUAL: Winning row check marks pulse (cyclic glow on green ✓)
  gsap.to('.checkB', {
    opacity: 0.55, duration: 1.2, repeat: -1, yoyo: true, ease: 'sine.inOut', stagger: 0.18, delay: 3.6
  });

  // PERPETUAL: Panel B border breathing (Champion highlight)
  gsap.to('#panelB rect:first-child', {
    strokeWidth: 2.2, duration: 2.6, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 4
  });

  // PERPETUAL: corner ring rotation
  gsap.to('#ringInner', { rotation: 360, transformOrigin: 'center', duration: 16, repeat: -1, ease: 'none' });

  // PERPETUAL: vertical scan line sweep (top to bottom)
  gsap.to('#scanLine', { attr: { y: 1280 }, duration: 7, repeat: -1, ease: 'none', delay: 1.2 });

  // PERPETUAL: row-by-row cross-pulse highlight on both panels
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  const rowYsA = [290, 340, 390, 440, 490, 540];
  const rowYsB = [780, 830, 880, 930, 980, 1030];
  let curRow = 0;
  function pulseRow() {
    const yA = rowYsA[curRow];
    const yB = rowYsB[curRow];
    const rectA = document.createElementNS(ns, 'rect');
    rectA.setAttribute('x', 48); rectA.setAttribute('y', yA);
    rectA.setAttribute('width', 624); rectA.setAttribute('height', 50);
    rectA.setAttribute('fill', '#a85c5c'); rectA.setAttribute('opacity', 0);
    svg.appendChild(rectA);
    const rectB = document.createElementNS(ns, 'rect');
    rectB.setAttribute('x', 48); rectB.setAttribute('y', yB);
    rectB.setAttribute('width', 624); rectB.setAttribute('height', 50);
    rectB.setAttribute('fill', '#5ca870'); rectB.setAttribute('opacity', 0);
    svg.appendChild(rectB);

    gsap.to([rectA, rectB], { opacity: 0.07, duration: 0.4, ease: 'power2.out' });
    gsap.to([rectA, rectB], {
      opacity: 0, duration: 1.2, delay: 0.6, ease: 'power2.in',
      onComplete: () => { rectA.remove(); rectB.remove(); }
    });
    curRow = (curRow + 1) % 6;
  }
  setTimeout(() => setInterval(pulseRow, 1500), 4000);
})();
</script></body></html>
