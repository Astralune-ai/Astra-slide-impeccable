<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f1e8;        /* 素白宣纸 */
  --ink:#1a1714;       /* 徽墨 */
  --ink-soft:#4a433c;  /* 淡墨 */
  --warm-grey:#7a7268; /* 温灰 */
  --sage:#3a9687;      /* 青竹绿 */
  --vermilion:#a03a36; /* 朱砂 */
  --indigo:#25577a;    /* 靛青 */
  --copper:#c88763;    /* 古铜 */
  --leaf:#3d7a50;      /* 叶绿 */
}
html{font-size:16px}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans SC',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* ── slide cycling ── */
.slide{
  position:fixed;inset:0;
  width:100vw;height:100vh;height:100dvh;
  overflow:hidden;
  opacity:0;pointer-events:none;
  transition:opacity .7s cubic-bezier(.22,1,.36,1);
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}
.slide.active{opacity:1;pointer-events:auto}
.slide svg{width:100%;height:100%;max-width:100vw;max-height:100vh;object-fit:contain}

/* ── chrome ── */
.progress-bar{
  position:fixed;top:0;left:0;height:2px;
  background:var(--sage);z-index:200;
  transition:width .6s cubic-bezier(.22,1,.36,1);
}
.page-counter{
  position:fixed;bottom:clamp(12px,1.5vh,18px);right:clamp(16px,2vw,24px);
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--sage);opacity:.55;z-index:200;
  letter-spacing:.2em;
}

/* ── CSS animations scoped to active slide ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeRight{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeLeft{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes dashRotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes dashRotateCCW{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@keyframes bladeExtend{from{stroke-dasharray:0 300}to{stroke-dasharray:300 0}}
@keyframes satellitePulse{0%,100%{opacity:.85;r:3}50%{opacity:.4;r:4.2}}

/* ── perpetual rotations, work even without active class ── */
.ring-inner{transform-box:fill-box;transform-origin:50% 50%;animation:dashRotate 22s linear infinite}
.orn-ring-ccw{transform-box:fill-box;transform-origin:50% 50%;animation:dashRotateCCW 60s linear infinite}
.orn-ring-cw{transform-box:fill-box;transform-origin:50% 50%;animation:dashRotate 80s linear infinite}

/* ── slide-scoped entrance animations ── */
.anim{opacity:0}
.slide.active .a-d0{animation:fadeIn .5s .1s forwards}
.slide.active .a-d1{animation:fadeUp .7s .2s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .a-d2{animation:fadeUp .7s .4s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .a-d3{animation:fadeUp .7s .6s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .a-d4{animation:fadeUp .7s .8s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .a-d5{animation:fadeUp .7s 1.0s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .a-d6{animation:fadeUp .7s 1.2s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .a-d7{animation:fadeUp .7s 1.4s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .a-scale{animation:scaleIn .9s .9s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .a-right{animation:fadeRight .7s .3s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .a-left{animation:fadeLeft .7s .3s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .sat-dot{animation:fadeIn .6s 1.5s forwards,satellitePulse 2.8s 2.5s ease-in-out infinite}

/* champion border breath — subtle strokeWidth yoyo via opacity on twin stroke */
@keyframes champBreath{0%,100%{stroke-opacity:.55}50%{stroke-opacity:.9}}
.slide.active .champ-halo{animation:fadeIn .5s 2.1s forwards,champBreath 3s 2.6s ease-in-out infinite}

/* blade line extension */
.slide.active .blade{stroke-dasharray:0 300;animation:bladeExtend .9s 1.6s cubic-bezier(.22,1,.36,1) forwards}
</style>
</head>

<script>
(function(){
  var slides=document.querySelectorAll('.slide');
  var total=slides.length;
  var current=0;
  var progress=document.getElementById('progress');
  var counter=document.getElementById('counter');
  function update(){
    slides.forEach(function(s,i){s.classList.toggle('active',i===current)});
    progress.style.width=((current+1)/total*100)+'%';
    counter.textContent=(current+1)+' / '+total;
  }
  function next(){if(current<total-1){current++;update()}}
  function prev(){if(current>0){current--;update()}}
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')next();
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')prev();
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('button,a,.nav'))return;
    next();
  });
  var tx=0;
  document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',function(e){
    var d=e.changedTouches[0].clientX-tx;
    if(Math.abs(d)>50){d<0?next():prev()}
  },{passive:true});
  update();
})();
</script>
